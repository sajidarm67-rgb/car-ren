<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body class="feedback">
  <section id="feedback">
    <h2>Send us your feedback</h2>
    <p>We would love to hear about your experience. Your feedback helps us improve.</p>
  
    <form action="#" method="get">
      <fieldset>
        <legend>Feedback form</legend>
  
        <label for="fb-name">Your name:</label><br>
        <input type="text" id="fb-name" name="fb-name" placeholder="Your name" required><br><br>
  
        <label for="fb-email">Email:</label><br>
        <input type="email" id="fb-email" name="fb-email" placeholder="you@example.com" required><br><br>
  
        <label for="fb-rating">How would you rate us?</label><br>
        <select id="fb-rating" name="rating">
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Very good</option>
          <option value="3">3 - Good</option>
          <option value="2">2 - Fair</option>
          <option value="1">1 - Poor</option>
        </select><br><br>
  
        <label for="fb-message">Your message:</label><br>
        <textarea id="fb-message" name="fb-message" rows="5" cols="40"
          placeholder="Tell us what you liked or what we can improve..." required></textarea><br><br>
  
        <button type="submit">Submit feedback</button>
        <button type="reset">Reset</button>
      </fieldset>
    </form>
  </section>
</body>
</html>
